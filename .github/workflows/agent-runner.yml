name: Fábrica de Agentes IA
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fabrica-de-agentes-ia
  cancel-in-progress: false
jobs:
  process:
    if: ${{ vars.AGENT_RUNNER_ENABLED == 'true' && github.repository_id == '1432658222' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preparar el ejecutor de este commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = '1432658222'
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 30 --output runner.mjs "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/run-cloud-queue.mjs"
      - name: Procesar pendientes existentes
        shell: bash
        env:
          SITE_ORIGIN: https://agente-ricardo-revision-rick.glassybell1025.chatgpt.site
          SITE_SERVICE_BEARER: ${{ secrets.SITE_SERVICE_BEARER }}
          AGENT_RUNNER_SECRET: ${{ secrets.AGENT_RUNNER_SECRET }}
        run: node runner.mjs
