name: Training regression certification
on:
  push:
    branches: [main, fix/training-payload-limit]
    paths: ["skills/**", "third-party/**", "web/**", "worker/**", "scripts/**", "examples/**", ".github/workflows/training-regression.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-agent.mjs
      - run: node scripts/test-cloud-runner.mjs
      - run: node --check web/mascot-expressions.js && node --check web/i18n.js
      - run: node scripts/test-training-ui.mjs
      - name: Check official five-capability SDK laboratory syntax
        run: node --check examples/official-agents-sdk/five-capabilities.mjs
      - name: Validate six specialist handoffs (mock, no API costs)
        run: node --experimental-vm-modules examples/official-agents-sdk/test-pattern.mjs
      - run: node scripts/test-expression.mjs
      - run: node scripts/build.mjs
      - run: node scripts/validate-artifact.mjs
