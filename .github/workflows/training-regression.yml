name: Training regression certification
on:
  push:
    branches: [fix/training-payload-limit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-agent.mjs
      - run: node scripts/test-cloud-runner.mjs
      - run: node scripts/build.mjs
      - run: node scripts/validate-artifact.mjs
