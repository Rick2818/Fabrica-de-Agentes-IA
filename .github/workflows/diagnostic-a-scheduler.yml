name: Diagnostic A - scheduler minimo
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Registrar evento
        run: |
          echo "diagnostic=A event=$GITHUB_EVENT_NAME actor=$GITHUB_ACTOR sha=$GITHUB_SHA"
          date -u +"UTC=%Y-%m-%dT%H:%M:%SZ"
